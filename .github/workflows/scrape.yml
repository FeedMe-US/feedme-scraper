name: Menu Scraper

on:
  schedule:
    # 5 AM and 5 PM PST
    - cron: '0 13 * * *'
    - cron: '0 1 * * *'

  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no database writes)'
        required: false
        default: false
        type: boolean
      days:
        description: 'Number of days to scrape'
        required: false
        default: '7'
        type: string

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: go.sum

      - name: Build scraper
        run: go build -o feedme-scraper .

      - name: Run scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GRAFANA_METRICS_URL: ${{ secrets.GRAFANA_METRICS_URL }}
          GRAFANA_METRICS_USER: ${{ secrets.GRAFANA_METRICS_USER }}
          GRAFANA_METRICS_API_KEY: ${{ secrets.GRAFANA_METRICS_API_KEY }}
        run: |
          echo "=== SECRET DIAGNOSTICS ==="
          echo "URL host: $(echo "$SUPABASE_URL" | sed 's|https://||' | cut -d'.' -f1)"
          echo "URL length: ${#SUPABASE_URL}"
          echo "Key length: ${#SUPABASE_SERVICE_KEY}"
          echo "Key ref: $(echo "$SUPABASE_SERVICE_KEY" | cut -d'.' -f2 | base64 -d 2>/dev/null | grep -o '"ref":"[^"]*"' || echo "JWT decode failed")"
          echo "Key role: $(echo "$SUPABASE_SERVICE_KEY" | cut -d'.' -f2 | base64 -d 2>/dev/null | grep -o '"role":"[^"]*"' || echo "JWT decode failed")"
          echo "=== END DIAGNOSTICS ==="
          DAYS="${{ github.event.inputs.days || '7' }}"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ./feedme-scraper run --dry-run --verbose --days "$DAYS"
          else
            ./feedme-scraper run --verbose --days "$DAYS" --push-metrics
          fi

      # Trigger embedding generation via API endpoint
      - name: Trigger embedding generation
        if: success() && github.event.inputs.dry_run != 'true'
        env:
          API_URL: ${{ secrets.API_URL }}
          API_ADMIN_KEY: ${{ secrets.API_ADMIN_KEY }}
        run: |
          echo "Triggering embedding generation..."
          curl -X POST "$API_URL/admin/generate-embeddings" \
            -H "X-Admin-Key: $API_ADMIN_KEY" \
            -H "Content-Type: application/json" \
            -d '{"batch_size": 100}' \
            --fail --silent --show-error
          echo "Embedding generation triggered"
